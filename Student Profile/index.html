<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="profile-card">

        <div class="profile-header">
            <img src="pic.jpg" alt="Student">
            <h1 id="studentName">Dinesh Pattanayak</h1>
            <p>BCA Student | Future AI Engineer 🚀</p>
        </div>

        <div class="details">

            <div class="detail-box">
                <h3>🎓 Education</h3>
                <p>Master of Computer Applications</p>
            </div>

            <div class="detail-box">
                <h3>💻 Skills</h3>
                <p>HTML, CSS, JavaScript, Angular, Python</p>
            </div>

            <div class="detail-box">
                <h3>📍 Location</h3>
                <p>Bhubaneswar, Odisha</p>
            </div>

            <div class="detail-box">
                <h3>📧 Email</h3>
                <p>dineshpattanayak@gmail.com</p>
            </div>

        </div>

        <button onclick="changeTheme()">
            🎨 Change Theme
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
